name: Asignar reviewer

# pull_request_target y no pull_request: con pull_request el workflow Y el script
# salen de la rama del PR, asi que su autor podria editarlos para exfiltrar el PAT.
# pull_request_target los toma de la rama base y nunca ejecuta codigo del PR.
on:
  pull_request_target:
    types: [ready_for_review, opened, reopened]

permissions: {}

jobs:
  assign:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - run: node .github/scripts/assign-reviewer.mjs
        env:
          # PAT (scope repo) porque GITHUB_TOKEN no ve el repo del back.
          GH_TOKEN: ${{ secrets.REVIEW_TOKEN }}
          LOAD_REPOS: LucaElbio/vocaia-backend,mareFernando03/vocaia-frontend
