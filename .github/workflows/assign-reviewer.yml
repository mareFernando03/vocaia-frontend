name: Asignar reviewer

# pull_request y no pull_request_target, solo en este repositorio. Es el unico
# publico de los tres, y GitHub bloquea pull_request_target en los publicos: el
# 09/11 lo apago a prueba (el assign de #56 no llego a arrancar) y desde el
# 02/12/2026 lo bloquea siempre, salvo una politica de eventos que lo habilite.
# En 5to y el backend, que son privados, sigue pull_request_target.
#
# Para el PAT el riesgo no cambia. Con pull_request el workflow y el script
# salen de la rama del PR, pero solo quien puede subir una rama a este repo abre
# un PR desde el, y esa persona ya podria leer el secret con un workflow propio
# en cada push. A un PR desde un fork, pull_request no le pasa los secrets: es de
# lo que protegia pull_request_target, y el job falla sin GH_TOKEN en vez de
# exponerlo.
on:
  pull_request:
    types: [ready_for_review, opened, reopened]

# `contents: read` y no `{}`: con permisos vacios el GITHUB_TOKEN no puede leer
# el repo y `actions/checkout` no puede clonar. Aca no se notaba porque este
# repo es publico y se clona sin autenticacion; en el backend, que es privado,
# el mismo archivo fallaba en todos los PRs con «Repository not found» —GitHub
# devuelve 404 y no 403 para no admitir que el repo existe—. Si este repo pasa a
# privado alguna vez, romperia igual.
#
# Leer es todo lo que hace falta: el script se autentica con el PAT
# (`secrets.REVIEW_TOKEN`), no con el GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  assign:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      # `base.ref` y no `base.sha`: base.sha es el merge-base —el commit del que
      # salio la rama—, no la punta de la base. Una rama que salio de un main
      # viejo hace checkout de un arbol sin este script y el job muere con
      # MODULE_NOT_FOUND. Paso en el PR de VOCAIA-49, y como el workflow solo
      # dispara en opened/reopened, nunca reintenta solo.
      # Con pull_request el workflow ya sale de la rama del PR; clonar la base
      # sigue haciendo que el script sea el de main.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - run: node .github/scripts/assign-reviewer.mjs
        env:
          # PAT (scope repo) porque GITHUB_TOKEN no ve el repo del back.
          GH_TOKEN: ${{ secrets.REVIEW_TOKEN }}
          # Los tres repositorios: 5to tambien tiene este workflow desde
          # VOCAIA-69, y es donde mas PRs se abren. Contar la carga sin el
          # subestimaba a quien venia revisando documentacion toda la semana.
          LOAD_REPOS: FabriQuinteros/5to,LucaElbio/vocaia-backend,mareFernando03/vocaia-frontend
